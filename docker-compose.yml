version: '3.8'

services:
  postgres:
    image: postgis/postgis:latest
    container_name: cousp_db
    restart: always
    environment:
      POSTGRES_USER: bearing
      POSTGRES_PASSWORD: Couspdata
      POSTGRES_DB: ids_db
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/data:/db/data
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_cousp
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: data.analyse@cousp.org
      PGADMIN_DEFAULT_PASSWORD: DataCousp
    ports:
      - "5050:80"
    depends_on:
      - postgres

  metabase:
    image: metabase/metabase:latest
    container_name: metabase_cousp
    restart: always
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase.db
    volumes:
      - metabase_data:/metabase.db
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: cousp_web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=ids_db
      - DB_USER=bearing
      - DB_PASS=Couspdata

volumes:
  postgres_data:
  metabase_data:
