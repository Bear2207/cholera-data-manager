version: '3.8'

services:
  postgres:
    image: postgis/postgis:latest
    container_name: cousp_db
    restart: always
    environment:
      POSTGRES_USER: bearing
      POSTGRES_PASSWORD: Couspdata
      POSTGRES_DB: ll_cousp
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/data:/db/data
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cousp_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_cousp
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: data.analyse@cousp.org
      PGADMIN_DEFAULT_PASSWORD: DataCousp
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - cousp_network

  metabase:
    image: metabase/metabase:latest
    container_name: metabase_cousp
    restart: always
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase.db
    volumes:
      - metabase_data:/metabase.db
    depends_on:
      - postgres
    networks:
      - cousp_network

  superset:
    image: apache/superset:latest
    container_name: superset_cousp
    restart: always
    environment:
      SUPERSET_SECRET_KEY: "secret_key_cholera"
      ADMIN_USERNAME: admin
      ADMIN_FIRST_NAME: "bearing"
      ADMIN_LAST_NAME: "kalela"
      ADMIN_EMAIL: admin@cousp.org
      ADMIN_PASSWORD: admin123
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - superset_home:/app/superset_home
    ports:
      - "8088:8088"
    depends_on:
      - postgres
    networks:
      - cousp_network

  cholera-pipeline:
    image: python:3.9-slim
    container_name: cholera_pipeline
    restart: unless-stopped
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./db/data:/app/db_data
      - ./output:/app/output
    working_dir: /app
    command: >
      bash -c "
        pip install --upgrade pip &&
        pip install -r scripts/requirements.txt &&
        pip install python-levenshtein &&
        python -m scripts.main"
    depends_on:
      - postgres
    networks:
      - cousp_network

volumes:
  postgres_data:
  metabase_data:
  superset_home:

networks:
  cousp_network:
    driver: bridge